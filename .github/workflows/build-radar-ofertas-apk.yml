name: Build Radar Promo Ofertas APK
# Build the checked-out revision; debug artifacts are for evaluation.
on:
  push:
    branches: [main, fix/android-consolidation-20261126]
    paths:
      - '.github/workflows/build-radar-ofertas-apk.yml'
      - 'mobile/radar_promo_ofertas/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-radar-ofertas-apk.yml'
      - 'mobile/radar_promo_ofertas/**'
  workflow_dispatch:
    inputs:
      generate_apk:
        description: 'Generate final audit APK only after all audits are complete'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Flutter source revision
        uses: actions/checkout@v4
      - name: Verify Flutter project
        run: test -f mobile/radar_promo_ofertas/pubspec.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile/radar_promo_ofertas
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: mobile/radar_promo_ofertas
        run: flutter analyze
      - name: Test
        working-directory: mobile/radar_promo_ofertas
        run: flutter test --dart-define=CAPTURE_AUDIT=true
      - name: Compile Android XML resources without building an APK
        shell: bash
        run: |
          aapt2_path=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          test -n "$aapt2_path"
          "$aapt2_path" compile --dir mobile/radar_promo_ofertas/android/app/src/main/res -o "$RUNNER_TEMP/radar-resources.zip"
      - name: Upload labeled widget-render evidence (not device validation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-widget-evidence
          path: mobile/radar_promo_ofertas/build/audit_visual_evidence/
          if-no-files-found: ignore
          retention-days: 3
      - name: Build debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_apk == true }}
        working-directory: mobile/radar_promo_ofertas
        run: flutter build apk --debug
      - name: Record source and APK checksums
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_apk == true }}
        working-directory: mobile/radar_promo_ofertas
        run: |
          git rev-parse HEAD > build/app/outputs/flutter-apk/source-commit.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/app-debug.apk.sha256
      - name: Upload installable APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_apk == true }}
        uses: actions/upload-artifact@v4
        with:
          name: radar-promo-ofertas-apk-debug
          path: |
            mobile/radar_promo_ofertas/build/app/outputs/flutter-apk/app-debug.apk
            mobile/radar_promo_ofertas/build/app/outputs/flutter-apk/app-debug.apk.sha256
            mobile/radar_promo_ofertas/build/app/outputs/flutter-apk/source-commit.txt
          if-no-files-found: error
          retention-days: 30
