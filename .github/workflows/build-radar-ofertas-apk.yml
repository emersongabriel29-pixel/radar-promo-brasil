name: Build Radar Promo Ofertas APK
# Validate the checked-out revision. Release artifacts are manual and final-only.
on:
  push:
    branches: [main, fix/android-consolidation-20261126]
    paths:
      - '.github/workflows/build-radar-ofertas-apk.yml'
      - 'mobile/radar_promo_ofertas/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-radar-ofertas-apk.yml'
      - 'mobile/radar_promo_ofertas/**'
  workflow_dispatch:
    inputs:
      generate_apk:
        description: 'Generate final audit APK only after all audits are complete'
        type: boolean
        default: false
      audits_validated:
        description: 'All 25 audits and pre-installation checks are validated'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Flutter source revision
        uses: actions/checkout@v4
      - name: Verify Flutter project
        run: test -f mobile/radar_promo_ofertas/pubspec.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile/radar_promo_ofertas
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: mobile/radar_promo_ofertas
        run: flutter analyze
      - name: Test
        working-directory: mobile/radar_promo_ofertas
        run: flutter test --dart-define=CAPTURE_AUDIT=true
      - name: Compile Android XML resources without building an APK
        shell: bash
        run: |
          aapt2_path=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          test -n "$aapt2_path"
          "$aapt2_path" compile --dir mobile/radar_promo_ofertas/android/app/src/main/res -o "$RUNNER_TEMP/radar-resources.zip"
      - name: Validate Gradle signing configuration without application builds
        working-directory: mobile/radar_promo_ofertas
        shell: bash
        run: |
          python3 - <<'PYCONFIG'
          import os
          from pathlib import Path
          Path('android/local.properties').write_text(
              'flutter.sdk=' + os.environ['FLUTTER_ROOT'] + '\n' +
              'sdk.dir=' + os.environ['ANDROID_HOME'] + '\n' +
              'flutter.versionName=0.3.2\nflutter.versionCode=5\n')
          PYCONFIG
          cd android
          if ! bash ./gradlew :app:tasks --all --console=plain > "$RUNNER_TEMP/radar-gradle-tasks.log" 2>&1; then
            tail -100 "$RUNNER_TEMP/radar-gradle-tasks.log"
            exit 1
          fi
          if bash ./gradlew :app:validateRadarReleaseSigning --console=plain > "$RUNNER_TEMP/radar-signing-check.log" 2>&1; then
            echo 'Signing guard unexpectedly accepted missing credentials'
            exit 1
          fi
          grep -q RADAR_SIGNING_MISSING "$RUNNER_TEMP/radar-signing-check.log"
          # Disposable test identity: never used to sign or distribute the app.
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/radar-signing-fixture.p12" -storepass radar-fixture-only -keypass radar-fixture-only -alias fixture -dname CN=RadarSigningTestFixture -keyalg RSA -keysize 2048 -validity 1 > "$RUNNER_TEMP/radar-fixture.log" 2>&1
          export RADAR_RELEASE_STORE_FILE="$RUNNER_TEMP/radar-signing-fixture.p12"
          export RADAR_RELEASE_STORE_PASSWORD=radar-fixture-only
          export RADAR_RELEASE_KEY_ALIAS=fixture
          export RADAR_RELEASE_KEY_PASSWORD=radar-fixture-only
          if bash ./gradlew :app:validateRadarReleaseSigning --console=plain > "$RUNNER_TEMP/radar-signing-mismatch.log" 2>&1; then
            echo 'Signing guard unexpectedly accepted a different certificate'
            exit 1
          fi
          grep -q RADAR_SIGNING_MISMATCH "$RUNNER_TEMP/radar-signing-mismatch.log"
          export RADAR_RELEASE_KEY_PASSWORD=wrong-fixture-password
          if bash ./gradlew :app:validateRadarReleaseSigning --console=plain > "$RUNNER_TEMP/radar-signing-unreadable.log" 2>&1; then
            echo 'Signing guard unexpectedly accepted an unreadable private key'
            exit 1
          fi
          grep -q RADAR_SIGNING_UNREADABLE "$RUNNER_TEMP/radar-signing-unreadable.log"
          bash ./gradlew :app:assembleRelease --dry-run --console=plain > "$RUNNER_TEMP/radar-release-task-graph.log" 2>&1
          grep -q ':app:validateRadarReleaseSigning SKIPPED' "$RUNNER_TEMP/radar-release-task-graph.log"
          test -z "$(find ../build -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)"
      - name: Upload labeled widget-render evidence (not device validation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-widget-evidence
          path: mobile/radar_promo_ofertas/build/audit_visual_evidence/
          if-no-files-found: ignore
          retention-days: 3
      # One explicit user-requested test build. Remove this block after delivery.
      - name: Build explicitly requested test APK 0.3.2+5
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/android-consolidation-20261126' && github.event.head_commit.message == 'build(android): generate requested test APK 0.3.2+5 [20261127]' }}
        working-directory: mobile/radar_promo_ofertas
        shell: bash
        env:
          RADAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RADAR_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RADAR_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RADAR_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build/requested-apk
          if [ -n "$RADAR_ANDROID_KEYSTORE_BASE64" ] && [ -n "$RADAR_RELEASE_STORE_PASSWORD" ] && [ -n "$RADAR_RELEASE_KEY_ALIAS" ] && [ -n "$RADAR_RELEASE_KEY_PASSWORD" ]; then
            umask 077
            printf '%s' "$RADAR_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radar-requested-release.keystore"
            export RADAR_RELEASE_STORE_FILE="$RUNNER_TEMP/radar-requested-release.keystore"
            flutter build apk --release --target-platform android-arm64
            cp build/app/outputs/flutter-apk/app-release.apk build/requested-apk/candidate.apk
            echo mode=release > build/requested-apk/build-info.txt
          else
            echo 'Existing CI signing credentials unavailable; build test APK for local signing with preserved identity.'
            flutter build apk --debug --target-platform android-arm64
            cp build/app/outputs/flutter-apk/app-debug.apk build/requested-apk/candidate.apk
            echo mode=debug-for-local-signing > build/requested-apk/build-info.txt
          fi
          git rev-parse HEAD >> build/requested-apk/build-info.txt
          signer_jar=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner.jar | sort -V | tail -1)
          test -n "$signer_jar"
          cp "$signer_jar" build/requested-apk/apksigner.jar
          sha256sum build/requested-apk/candidate.apk > build/requested-apk/candidate.apk.sha256
      - name: Upload requested test build for signature verification
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/android-consolidation-20261126' && github.event.head_commit.message == 'build(android): generate requested test APK 0.3.2+5 [20261127]' }}
        uses: actions/upload-artifact@v4
        with:
          name: radar-test-build-for-local-signing-0.3.2
          path: mobile/radar_promo_ofertas/build/requested-apk/
          if-no-files-found: error
          retention-days: 3
      - name: Prepare existing release signing identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_apk == true && inputs.audits_validated == true }}
        shell: bash
        env:
          RADAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$RADAR_ANDROID_KEYSTORE_BASE64" || { echo 'Existing release keystore is unavailable'; exit 1; }
          umask 077
          printf '%s' "$RADAR_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radar-release.keystore"
      - name: Build final signed APK and AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_apk == true && inputs.audits_validated == true }}
        working-directory: mobile/radar_promo_ofertas
        env:
          RADAR_RELEASE_STORE_FILE: ${{ runner.temp }}/radar-release.keystore
          RADAR_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RADAR_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RADAR_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
          git rev-parse HEAD > build/app/outputs/flutter-apk/source-commit.txt
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
          sha256sum build/app/outputs/bundle/release/app-release.aab > build/app/outputs/bundle/release/app-release.aab.sha256
      - name: Upload final signed application artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_apk == true && inputs.audits_validated == true }}
        uses: actions/upload-artifact@v4
        with:
          name: radar-promo-ofertas-final-release
          path: |
            mobile/radar_promo_ofertas/build/app/outputs/flutter-apk/app-release.apk
            mobile/radar_promo_ofertas/build/app/outputs/flutter-apk/app-release.apk.sha256
            mobile/radar_promo_ofertas/build/app/outputs/flutter-apk/source-commit.txt
            mobile/radar_promo_ofertas/build/app/outputs/bundle/release/app-release.aab
            mobile/radar_promo_ofertas/build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 7
