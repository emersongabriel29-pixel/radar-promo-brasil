name: CI
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - id: audit
        run: npm audit --audit-level=moderate
      # Continue browser tests after an audit finding so both results remain visible.
      # The audit step still fails the job; this does not bypass the security gate.
      - if: ${{ success() || steps.audit.outcome == 'failure' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ success() || steps.audit.outcome == 'failure' }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
