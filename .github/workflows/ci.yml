name: CI
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - id: audit
        run: npm audit --audit-level=moderate
      # Continue browser tests after an audit finding so both results remain visible.
      # The audit step still fails the job; this does not bypass the security gate.
      - if: ${{ success() || steps.audit.outcome == 'failure' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ success() || steps.audit.outcome == 'failure' }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/

  android:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'codex/android-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout Flutter app source
        uses: actions/checkout@v4
        with:
          repository: emersongabriel29-pixel/radar-promo-brasil
          ref: 8bb04882f9718dae084d75de0831411534f5616f
          path: flutter-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install locked Flutter dependencies
        working-directory: flutter-source/mobile/radar_promo_ofertas
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter app
        working-directory: flutter-source/mobile/radar_promo_ofertas
        run: flutter analyze
      - name: Test Flutter app
        working-directory: flutter-source/mobile/radar_promo_ofertas
        run: flutter test --reporter expanded
      - name: Build debug APK
        working-directory: flutter-source/mobile/radar_promo_ofertas
        run: flutter build apk --debug
      - name: Record APK provenance
        working-directory: flutter-source/mobile/radar_promo_ofertas
        run: |
          git -C ../.. rev-parse HEAD > build/app/outputs/flutter-apk/source-commit.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/app-debug.apk.sha256
      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: radar-promo-ofertas-apk-debug-${{ github.run_number }}
          path: |
            flutter-source/mobile/radar_promo_ofertas/build/app/outputs/flutter-apk/app-debug.apk
            flutter-source/mobile/radar_promo_ofertas/build/app/outputs/flutter-apk/app-debug.apk.sha256
            flutter-source/mobile/radar_promo_ofertas/build/app/outputs/flutter-apk/source-commit.txt
          if-no-files-found: error
          retention-days: 30
