name: Radar Promo Ofertas Android

on:
  workflow_dispatch:
  push:
    branches: [main, 'android/**']
    paths:
      - 'mobile/radar_promo_ofertas/**'
  pull_request:
    paths:
      - 'mobile/radar_promo_ofertas/**'

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/radar_promo_ofertas
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check existing Flutter source
        working-directory: .
        run: |
          if [ ! -f mobile/radar_promo_ofertas/pubspec.yaml ] || [ ! -d mobile/radar_promo_ofertas/android ]; then
            echo "::error::Import the existing Flutter project into mobile/radar_promo_ofertas before building."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Record SDK version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze source
        run: flutter analyze
      - name: Run existing tests
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "::error::No Flutter tests are present. Add meaningful tests before accepting validation."
            exit 1
          fi
      - name: Record validation scope
        run: |
          echo "Análise estática e testes existentes concluídos. Nenhum APK foi gerado." >> "$GITHUB_STEP_SUMMARY"
          echo "Integrações e funcionamento em aparelho ainda exigem validação própria." >> "$GITHUB_STEP_SUMMARY"
