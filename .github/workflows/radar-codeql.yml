name: Radar Promo Brasil CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "api/**"
      - "public/**"
      - "pages/**"
      - "*.js"
      - "*.ts"
      - "*.tsx"
      - ".github/workflows/radar-codeql.yml"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
      - name: Stage SARIF for artifact upload
        run: |
          mkdir -p codeql-results
          cp ../results/javascript.sarif codeql-results/javascript.sarif
      - name: Archive SARIF for manual triage
        uses: actions/upload-artifact@v4
        with:
          name: radar-codeql-sarif-${{ github.run_id }}
          path: codeql-results/javascript.sarif
          if-no-files-found: error
          retention-days: 30
