name: Radar Ofertas Flutter validation

# Registered on main so GitHub enables manual runs for the development branch.
# No deployment, publishing, or production credentials are used.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ofertas-price-watch-ui-204
    paths:
      - 'mobile/radar_promo_ofertas/**'
      - '.github/workflows/radar-ofertas-validation.yml'

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/radar_promo_ofertas
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      # Audit validation must never compile or upload intermediate APKs.
