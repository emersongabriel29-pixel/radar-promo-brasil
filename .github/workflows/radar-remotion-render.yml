name: Radar Remotion isolated render

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "prototypes/remotion-offer-video/**"
      - ".github/workflows/radar-remotion-render.yml"

permissions:
  contents: read

jobs:
  render-synthetic-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototypes/remotion-offer-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototypes/remotion-offer-video/package.json
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Render vertical synthetic demo
        run: npx remotion render src/index.ts RadarOfferVideo out/radar-offer-vertical.mp4
      - name: Render horizontal synthetic demo
        run: npx remotion render src/index.ts RadarOfferVideoLandscape out/radar-offer-horizontal.mp4
      - name: Render preview still
        run: npx remotion still src/index.ts RadarOfferVideo out/preview.png --frame=45
      - name: Validate output files
        run: |
          test -s out/radar-offer-vertical.mp4
          test -s out/radar-offer-horizontal.mp4
          test -s out/preview.png
          file out/radar-offer-vertical.mp4 out/radar-offer-horizontal.mp4 out/preview.png
          ls -lh out/
      - name: Upload synthetic render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radar-remotion-synthetic-demo
          path: prototypes/remotion-offer-video/out/
          if-no-files-found: error
          retention-days: 7
