<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Capturador</title><link rel="stylesheet" href="popup.css"></head><body><header><b>R</b><div><strong>Radar Promo Brasil</strong><small>Capturador multiplataforma</small></div></header><p id="status">Abra uma página de produto e capture os dados.</p><button id="capture">Capturar página atual</button><form id="form"><label>Loja<input id="platform" readonly></label><label>Produto<input id="title" required></label><div class="grid"><label>Preço<input id="price"></label><label>Preço anterior<input id="originalPrice"></label></div><label>URL do produto<input id="productUrl" type="url" required></label><label>Link de afiliado<input id="affiliateUrl" type="url" placeholder="Opcional — cole o link oficial"></label><div class="grid"><label>Sub_id / canal<input id="subId"></label><label>Categoria<input id="category"></label></div><label>URL da imagem<input id="imageUrl" type="url"></label><label>Observações<textarea id="notes"></textarea></label><button type="submit">Salvar oferta localmente</button></form><section><h2>Ofertas salvas (<span id="count">0</span>)</h2><div id="offers"></div><button id="export">Exportar JSON</button><button id="copy">Copiar mensagem mais recente</button></section><p class="foot">Revisão manual. Não lê cookies, não contorna CAPTCHA e não publica automaticamente.</p><script src="popup.js"></script></body></html>
