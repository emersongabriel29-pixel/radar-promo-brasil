<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Promo Brasil</title><link rel="stylesheet" href="popup.css"></head><body><header><b>R</b><div><strong>Radar Promo Brasil</strong><small>Capturador multiplataforma</small></div></header><p id="status">Capture uma página e confira os dados.</p><button id="capture">Capturar página atual</button><form id="form"><label>Loja<input id="platform" readonly></label><label>Produto<input id="title" required></label><div class="grid"><label>Preço (R$)<input id="price" required placeholder="129,90"></label><label>Preço anterior<input id="originalPrice"></label></div><label>URL do produto<input id="productUrl" type="url" required></label><label>Link de afiliado HTTPS<input id="affiliateUrl" type="url" required></label><label>URL da imagem HTTPS<input id="imageUrl" type="url" required></label><div class="grid"><label>Sub_id / canal<input id="subId"></label><label>Categoria<input id="category"></label></div><label>Endpoint completo da API<input id="apiBase" type="url" placeholder="https://dominio-real/api/data"></label><label>Token Bearer (se a API suportar)<input id="apiToken" type="password" autocomplete="off"></label><button type="button" id="saveConfig">Salvar configuração</button><label>Observações<textarea id="notes"></textarea></label><button type="submit">Enviar oferta ao Radar</button></form><section><h2>Ofertas locais (<span id="count">0</span>)</h2><div id="offers"></div><button id="export">Exportar JSON</button><button id="copy">Copiar mensagem</button></section><p class="foot">Envio depende do endpoint e da autenticação oficiais do backend.</p><script src="popup.js"></script></body></html>
