[[api]]
name = "mercadolivre"
auth = "none"
base_url = "https://api.mercadolibre.com"
description = "Mercado Livre via conector direto do Radar Promo Brasil."

[mcp]
enabled = true

[ai]
required = true
description = "Categorizar produtos e criar mensagens de promoções sem inventar preço, estoque ou frete."

[[secret]]
name = "MELI_APP_ID"
required = true
description = "ID da aplicação do Mercado Livre."

[[secret]]
name = "MELI_CLIENT_SECRET"
required = true
description = "Segredo da aplicação do Mercado Livre."

[[secret]]
name = "MAGALU_CLIENT_ID"
required = false
description = "Client ID do aplicativo criado no ID Magalu para OAuth 2.0 seller; não é API Key ID."

[[secret]]
name = "MAGALU_CLIENT_SECRET"
required = false
description = "Client Secret do aplicativo criado no ID Magalu para OAuth 2.0 seller; manter somente no servidor."

[[secret]]
name = "MAGALU_TENANT_ID"
required = false
description = "Tenant ID autorizado da conta/seller Magalu, usado no cabeçalho X-Tenant-Id nas consultas oficiais. Obtenha no ID Magalu/conta autorizada; não confundir com Client ID, API Key ID ou número de pedido."

[[secret]]
name = "CONNECTOR_ENCRYPTION_KEY"
required = true
description = "Chave com pelo menos 32 caracteres para proteger tokens OAuth no banco."

[[secret]]
name = "YOUTUBE_CLIENT_ID"
required = false
description = "OAuth Client ID do projeto Google Cloud com YouTube Data API v3 habilitada."

[[secret]]
name = "YOUTUBE_CLIENT_SECRET"
required = false
description = "OAuth Client Secret do projeto Google Cloud para conectar o canal do YouTube."

[[config]]
name = "radar_ai_provider"
required = false
default = "gemini"
description = "Provedor principal de texto e análise: gemini ou ollama. O padrão permanece Gemini até a configuração e validação do servidor Ollama."

[[config]]
name = "ollama_base_url"
required = false
default = ""
description = "URL HTTPS pública do proxy autenticado do servidor Ollama, sem credenciais ou token na URL."

[[config]]
name = "ollama_model"
required = false
default = ""
description = "Nome exato do modelo já instalado no servidor Ollama, incluindo tag quando aplicável."

[[secret]]
name = "OLLAMA_API_KEY"
required = false
description = "Token Bearer do proxy HTTPS que protege o servidor Ollama. Nunca exponha no navegador ou GitHub."

[[secret]]
name = "GEMINI_API_KEY"
required = false
description = "Chave Gemini API usada pelo gerador de cenas de vídeo com IA do Google."

[[secret]]
name = "RUNWAY_API_KEY"
required = false
description = "Chave da API do Runway usada pelo conector direto."

[[secret]]
name = "N8N_API_KEY"
required = false
description = "Chave da API REST do n8n; usada somente em consultas autenticadas de leitura, separada do MCP."

[[secret]]
name = "N8N_MCP_ACCESS_TOKEN"
required = false
description = "Token Bearer de acesso ao MCP do n8n; configure em segredo após gerar em Settings > Instance-level MCP."

[[secret]]
name = "N8N_MCP_CLIENT_ID"
required = false
description = "Client ID OAuth do n8n MCP, usado apenas se a instância exigir OAuth."

[[secret]]
name = "N8N_MCP_CLIENT_SECRET"
required = false
description = "Client Secret OAuth do n8n MCP; manter somente no cofre seguro."

[[secret]]
name = "N8N_WEBHOOK_SECRET"
required = true
description = "Segredo compartilhado para assinar as requisições entre o n8n e o Radar Promo Brasil."

[[secret]]
name = "WHATSAPP_CLONE_WEBHOOK_SECRET"
required = false
description = "Segredo exclusivo de pelo menos 32 caracteres para autenticar webhooks de captura do WhatsApp via OpenWA ou Evolution API. Não reutilize tokens de WhatsApp, n8n ou outras integrações."

[[secret]]
name = "API_CREDENTIALS_MASTER_KEY"
required = true
description = "Chave aleatória forte com pelo menos 32 caracteres para criptografar chaves de API cadastradas por conta."

[[secret]]
name = "TELEGRAM_WEBHOOK_SECRET"
required = false
description = "Segredo exclusivo para validar webhooks de entrada do Telegram; use 32–256 caracteres alfanuméricos, hífen ou sublinhado. Não reutilize tokens de bot."

[[secret]]
name = "TELEGRAM_BOT_TOKEN_1"
required = false
description = "Token do bot principal criado no @BotFather."

[[secret]]
name = "TELEGRAM_BOT_TOKEN_2"
required = false
description = "Token opcional do segundo bot para fallback."

[[secret]]
name = "TELEGRAM_BOT_TOKEN_3"
required = false
description = "Token opcional do terceiro bot para fallback."

[[secret]]
name = "META_PAGE_ACCESS_TOKEN"
required = false
description = "Token oficial da Página Meta, mantido somente no servidor."

[[secret]]
name = "META_FACEBOOK_PAGE_ID"
required = false
description = "ID oficial da Página do Facebook autorizada."

[[secret]]
name = "META_INSTAGRAM_ACCOUNT_ID"
required = false
description = "ID da conta profissional do Instagram vinculada à Página."

[[config]]
name = "public_app_url"
required = false
default = "https://radar-promo-brasil.hatchable.site"
description = "Endereço público usado nos links enviados pelo Telegram."

[[config]]
name = "whatsapp_channel_api_url"
required = false
default = ""
description = "URL HTTPS da API comunitária auto-hospedada para publicar em Canal do WhatsApp."

[[secret]]
name = "WHATSAPP_CHANNEL_API_KEY"
required = false
description = "Chave privada da API auto-hospedada do Canal do WhatsApp. Nunca exponha no navegador ou no GitHub."

[[config]]
name = "youtube_redirect_uri"
required = false
default = "https://radar-promo-brasil.hatchable.site/api/video-studio/youtube-oauth"
description = "URI de redirecionamento OAuth cadastrada exatamente no Google Cloud para o envio de vídeos ao YouTube."

[[config]]
name = "meli_redirect_uri"
required = false
default = "https://radar-promo-brasil.hatchable.site/api/mercadolivre/callback"
description = "Callback OAuth direto do Mercado Livre."

[[secret]]
name = "EXTERNAL_WORKER_SECRET"
required = false
description = "Segredo HMAC exclusivo de pelo menos 32 caracteres para autenticar o worker externo Lomadee."

[[config]]
name = "lomadee_external_discovery_enabled"
required = false
default = "false"
description = "Ativa o consumo de descoberta externa Lomadee somente após validação manual do piloto."

[[cron]]
path = "/api/jobs/hourly"
schedule = "0 * * * *"

[[cron]]
path = "/api/jobs/shopee"
schedule = "0 * * * *"

[[cron]]
path = "/api/jobs/ai-enrichment"
schedule = "30 * * * *"

[[cron]]
path = "/api/jobs/lomadee"
schedule = "15 * * * *"

[[cron]]
path = "/api/jobs/aliexpress"
schedule = "25 * * * *"

[[cron]]
path = "/api/jobs/aliexpress-review"
schedule = "45 * * * *"

[[cron]]
path = "/api/jobs/telegram"
schedule = "0 * * * *"

# Telegram dispatch uses the Free-plan hourly cron plus one central batch wake-up; never one-shot per offer.

# WhatsApp channel publishing remains disabled pending explicit authorization.

[[cron]]
path = "/api/jobs/autopilot"
schedule = "5 * * * *"

[[cron]]
path = "/api/jobs/extension-autopublish"
schedule = "50 * * * *"

[[cron]]
path = "/api/jobs/social"
schedule = "10 */8 * * *"

[[cron]]
path = "/api/jobs/api-health"
schedule = "30 */4 * * *"

[[cron]]
path = "/api/jobs/lomadee-discovery-queue"
schedule = "20 */6 * * *"

# Hourly bounded batches replace one-shot chaining and respect the Free scheduler budget.
[[cron]]
path = "/api/jobs/lomadee-link-queue"
schedule = "40 * * * *"

[[cron]]
path = "/api/jobs/extension-offers-resolve-queue"
schedule = "50 * * * *"
# Persisted ingestion batches resume in bounded recurring runs, never one-shot per offer.
[[cron]]
path = "/api/jobs/ingestion"
schedule = "35 * * * *"

[[config]]
name = "SUPABASE_DB_BRIDGE_URL"
required = false
default = "https://runnmpzkomcdawwzuift.supabase.co/functions/v1/radar-db-bridge"
description = "URL HTTPS da ponte privada do banco Supabase; usada somente no servidor."

[[secret]]
name = "SUPABASE_DB_BRIDGE_SECRET"
required = false
description = "Segredo HMAC compartilhado entre Hatchable e Supabase Edge Function. Gere com 32 bytes aleatórios; nunca enviar pelo chat ou gravar no GitHub."
