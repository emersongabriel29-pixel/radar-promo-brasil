[[api]]
name = "mercadolivre"
auth = "none"
base_url = "https://api.mercadolibre.com"
description = "Mercado Livre via conector direto do Radar Promo Brasil."

[ai]
required = true
description = "Categorizar produtos e criar mensagens de promoções sem inventar preço, estoque ou frete."

[[secret]]
name = "MELI_APP_ID"
required = true
description = "ID da aplicação do Mercado Livre."

[[secret]]
name = "MELI_CLIENT_SECRET"
required = true
description = "Segredo da aplicação do Mercado Livre."

[[secret]]
name = "CONNECTOR_ENCRYPTION_KEY"
required = true
description = "Chave com pelo menos 32 caracteres para proteger tokens OAuth no banco."

[[secret]]
name = "RUNWAY_API_KEY"
required = false
description = "Chave da API do Runway usada pelo conector direto."

[[secret]]
name = "N8N_WEBHOOK_SECRET"
required = true
description = "Segredo compartilhado para assinar as requisições entre o n8n e o Radar Promo Brasil."

[[secret]]
name = "TELEGRAM_BOT_TOKEN_1"
required = false
description = "Token do bot principal criado no @BotFather."

[[secret]]
name = "TELEGRAM_BOT_TOKEN_2"
required = false
description = "Token opcional do segundo bot para fallback."

[[secret]]
name = "TELEGRAM_BOT_TOKEN_3"
required = false
description = "Token opcional do terceiro bot para fallback."

[[secret]]
name = "META_PAGE_ACCESS_TOKEN"
required = false
description = "Token oficial da Página Meta, mantido somente no servidor."

[[secret]]
name = "META_FACEBOOK_PAGE_ID"
required = false
description = "ID oficial da Página do Facebook autorizada."

[[secret]]
name = "META_INSTAGRAM_ACCOUNT_ID"
required = false
description = "ID da conta profissional do Instagram vinculada à Página."

[[config]]
name = "public_app_url"
required = false
default = "https://radar-promo-brasil.hatchable.site"
description = "Endereço público usado nos links enviados pelo Telegram."

[[config]]
name = "meli_redirect_uri"
required = false
default = "https://radar-promo-brasil.hatchable.site/api/mercadolivre/callback"
description = "Callback OAuth direto do Mercado Livre."

[[cron]]
path = "/api/jobs/hourly"
schedule = "0 * * * *"

[[cron]]
path = "/api/jobs/telegram"
schedule = "0 * * * *"

[[cron]]
path = "/api/jobs/autopilot"
schedule = "5 * * * *"

[[cron]]
path = "/api/jobs/social"
schedule = "10 * * * *"