<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Promo Ofertas</title><link rel="stylesheet" href="/theme.css"></head><body><main><h1>Radar Promo Ofertas</h1><p id="status">Consulte sua conta para continuar.</p><a href="/login">Entrar na conta</a><button id="logout" hidden>Sair</button></main><script>const a=window.hatchable?.auth;if(a)a.getSession().then(s=>{if(s?.user){document.getElementById('status').textContent='Sua conta está conectada.';document.getElementById('logout').hidden=false;}});document.getElementById('logout').onclick=async()=>{await a.signOut();location.reload();};</script></body></html>
