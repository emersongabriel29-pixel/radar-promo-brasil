<style>
:root{--ink:#102033;--navy:#101b2c;--navy2:#172840;--paper:#f4f7f9;--card:#fff;--line:#dfe6ea;--muted:#687787;--orange:#ff6a2a;--orange2:#e85012;--mint:#18c98d;--blue:#2274e0;--red:#e74747;--yellow:#f5b800;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}.mono{font-family:'DM Mono',monospace}.app{min-height:100vh;display:grid;grid-template-columns:272px minmax(0,1fr)}.side{height:100vh;position:sticky;top:0;background:var(--navy);color:white;padding:18px 14px;display:flex;flex-direction:column;z-index:40}.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 19px;border-bottom:1px solid #ffffff14}.mark{width:46px;height:46px;border-radius:14px;background:var(--orange);display:grid;place-items:center;font:800 17px 'DM Mono';box-shadow:0 9px 26px #ff6a2a33}.brand b{font-size:16px}.brand small{color:#9eb0c4;display:block;margin-top:3px}.nav{padding-top:14px;display:grid;gap:3px;overflow:auto}.nav button{border:0;background:transparent;color:#9fb0c2;padding:10px 11px;border-radius:10px;text-align:left;font-weight:600;display:flex;align-items:center;gap:10px}.nav button:hover,.nav button.on{background:#ffffff0c;color:white}.nav .ico{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:#ffffff0a;font:500 10px 'DM Mono'}.nav button.on .ico{background:var(--orange);color:white}.sidefoot{margin-top:auto;border:1px solid #ffffff16;border-radius:14px;padding:13px;background:#ffffff08}.sidefoot b{font-size:13px}.sidefoot p{font-size:12px;color:#9fb0c2;margin:6px 0 0;line-height:1.5}.main{min-width:0}.top{height:72px;padding:0 28px;border-bottom:1px solid var(--line);background:#fffffff2;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}.eyebrow{font:500 11px 'DM Mono';letter-spacing:.09em;color:#82909e;text-transform:uppercase}.top h1{font-size:21px;margin:2px 0 0}.topactions{display:flex;align-items:center;gap:10px}.content{max-width:1500px;margin:auto;padding:25px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--orange);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:var(--orange2)}.btn.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.btn.dark{background:var(--navy);color:#fff}.btn.green{background:#0ca776;color:#fff}.btn.danger{background:#fff0ef;color:#b72e2e}.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}.btn:disabled{opacity:.5;cursor:not-allowed}.menu{display:none}.view{display:none}.view.on{display:block}.hero{background:linear-gradient(115deg,#102238,#173b52 68%,#135a55);color:white;border-radius:22px;padding:28px;display:grid;grid-template-columns:1.6fr .8fr;gap:20px;overflow:hidden;position:relative}.hero:after{content:'';position:absolute;right:-70px;top:-100px;width:300px;height:300px;border-radius:50%;border:55px solid #18c98d18}.hero h2{font-size:34px;line-height:1.12;margin:8px 0 10px;max-width:720px}.hero p{margin:0;color:#b8c9d5;max-width:700px;line-height:1.6}.hero .actions{margin-top:20px}.pulsebox{align-self:stretch;border:1px solid #ffffff1c;background:#ffffff0a;border-radius:16px;padding:18px;position:relative;z-index:1}.pulse{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 6px #18c98d19}.pulsebox strong{font-size:26px}.pulsebox small{display:block;color:#9fc0c8;margin-top:4px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 22px}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}.metric{padding:17px}.metric label{display:block;color:var(--muted);font-size:13px}.metric b{display:block;font-size:26px;margin:7px 0 2px}.metric small{color:#879 t:8px;border-radius:50%;background:var(--blue);margin-top:5px}.activity time{font:400 10px 'DM Mono';color:#8a98a5}.empty{text-align:center;padding:38px;border:1px dashed #cbd5dc;border-radius:15px;background:white;color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.search{min-width:250px}.input{width:100%;padding:10px 12px;border:1px solid #d4dde2;border-radius:10px;background:white;outline:none}.input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6a2a18}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:white}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid #edf0f2}.table th{font:500 10px 'DM Mono';color:#70808e;text-transform:uppercase;background:#f8fafb}.table tr:last-child td{border:0}.leadhero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.leadmetric{padding:18px}.leadmetric b{font-size:27px;display:block;margin-top:6px}.bar{height:8px;background:#e9eef1;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{height:100%;display:block;background:var(--orange)}.integration{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f2}.integration:last-child{border:0}.intlogo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:#f1f4f6;font:800 11px 'DM Mono'}.callout{padding:14px;border-radius:12px;background:#fff6e9;border:1px solid #ffd8ad;color:#7b4a19;font-size:13px;line-height:1.55}.modal{display:none;position:fixed;inset:0;background:#07111dcc;z-index:70;place-items:center;padding:16px}.modal.on{display:grid}.dialog{background:white;border-radius:18px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:22px}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:700}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.toast{display:none;position:fixed;right:18px;bottom:18px;background:var(--navy);color:white;padding:13px 16px;border-radius:11px;z-index:90;box-shadow:0 12px 30px #07111d44}.toast.on{display:block}.shade{display:none}

/* Estilos adicionais e melhorias de UI */
.ai-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:#eef4fd;color:#185abc;font:600 12px 'DM Mono';border:1px solid #d2e3fc}
.ai-badge.on{background:#e6f8f1;color:#0b7d56;border-color:#b4ebd5}
.ai-dot{width:8px;height:8px;border-radius:50%;background:#185abc}
.ai-badge.on .ai-dot{background:#0ca776;animation:pulseAi 2s infinite}

.store-tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font:700 10px 'DM Mono';text-transform:uppercase}
.store-shopee{background:#fff1eb;color:#c94518;border:1px solid #ffd3c2}
.store-ml{background:#fff9db;color:#856404;border:1px solid #ffe8a1}

@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;width:min(86vw,300px);transform:translateX(-105%);transition:.22s}.side.open{transform:none}.shade.on{display:block;position:fixed;inset:0;background:#07111d99;z-index:35}.menu{display:inline-flex}.content{padding:16px}.top{padding:0 16px}.leadhero{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.metrics,.modes,.three,.leadhero,.formgrid{grid-template-columns:1fr}.hero{padding:22px}.hero h2{font-size:27px}.topactions .secondary{display:none}.row{align-items:flex-start;flex-wrap:wrap}.row .actions{width:100%}.search{min-width:100%}.steps{grid-template-columns:1fr 1fr}.sectionhead{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div class="app"><aside class="side" id="side"><div class="brand"><div class="mark">RPB</div><div><b>Radar Promo Brasil</b><small>Operação de afiliados</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot"><b>Automação protegida</b><p>Imagem, mensagem e link são validados antes de entrar na fila.</p></div></aside><div class="shade" id="shade" onclick="menu(false)"></div>
<main class="main"><header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn secondary menu" onclick="menu(true)">Menu</button><div><div class="eyebrow">Radar Promo Brasil</div><h1 id="title">Central de operação</h1></div></div><div class="topactions"><div id="aiBadge" class="ai-badge" title="Status da Inteligência Artificial"><span class="ai-dot"></span><span id="aiLabel">IA Conectada</span></div><button class="btn secondary" onclick="show('integrations')">Conexões</button><button class="btn" onclick="openOffer()">+ Nova oferta</button></div></header><div class="content" id="content"><div class="empty">Carregando sua operação...</div></div></main></div>
<div class="modal" id="modal"><div class="dialog"><div class="sectionhead" style="margin-top:0"><div><h2 id="modalTitle"></h2><p id="modalHint"></p></div><button class="btn secondary" onclick="closeModal()">Fechar</button></div><form class="form" id="form"></form></div></div><div class="toast" id="toast"></div>
<script>
var D={categories:[],groups:[],offers:[],publications:[],monitors:[],queues:[],schedules:[],leadStats:[],activity:[],integrations:[],automation:{},suite:{marketplaces:[],connections:[],telegramConnections:[],storefront:{},account:{}},reportsData:{summary:{},byCategory:[],byGroup:[],byPlatform:[],byChannel:[],daily:[],topOffers:[],delivery:[]},aiStatus:{configured:false,model:'gemini-3.8-flash'}},current='dashboard',selected=null,reportDays=30,offerFilter={search:'',store:'',category:''};
var NAV=[['dashboard','Central','DB'],['monitoring','Monitoramento 24h','24'],['clone','Modo clone','CL'],['quick','Criação rápida','60'],['queues','Filas e agendamento','FQ'],['offers','Ofertas','OF'],['groups','Grupos','GR'],['leads','Gestão de leads','LD'],['reports','Relatórios','BI'],['integrations','Integrações','IN'],['account','Conta, vitrine e planos','CT']];
var LABEL={PENDING:'Pendente',APPROVED:'Aprovada',REJECTED:'Ignorada',READY:'Pronta',SCHEDULED:'Agendada',PUBLISHED:'Publicada',FAILED:'Falhou',ACTIVE:'Ativo',PAUSED:'Pausado'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function brl(v){return v==null?'—':(v/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function cat(id){return D.categories.find(function(x){return x.id===id})}function grp(id){return D.groups.find(function(x){return x.id===id})}function off(id){return D.offers.find(function(x){return x.id===id})}function toast(s){var t=document.getElementById('toast');t.textContent=s;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2800)}
function menu(x){document.getElementById('side').classList.toggle('open',x);document.getElementById('shade').classList.toggle('on',x)}function nav(){document.getElementById('nav').innerHTML=NAV.map(function(n){return '<button class="'+(current===n[0]?'on':'')+'" onclick="show(\''+n[0]+'\')"><span class="ico">'+n[2]+'</span>'+n[1]+'</button>'}).join('')}function show(v){current=v;menu(false);nav();document.getElementById('title').textContent=NAV.find(function(n){return n[0]===v})[1];render()}
function updateAiBadge(){var el=document.getElementById('aiBadge'),lb=document.getElementById('aiLabel');if(!el||!lb)return;if(D.aiStatus&&D.aiStatus.configured){el.className='ai-badge on';lb.textContent='Gemini 3.8 Flash';el.title='IA Gemini 3.8 Flash ativa e pronta para gerar cópias persuasivas.'}else{el.className='ai-badge';lb.textContent='IA Local Pronta';el.title='Modo inteligente local pronto. Configure GEMINI_API_KEY para textos avançados do Gemini.'}}
async function load(){try{var responses=await Promise.all([fetch('/api/data'),fetch('/api/suite'),fetch('/api/reports?days='+reportDays)]),b=await responses[0].json(),s=await responses[1].json(),rp=await responses[2].json();if(!responses[0].ok)throw Error(b.error||'Falha ao carregar');D=Object.assign(b,{suite:responses[1].ok?s:{marketplaces:[],connections:[],telegramConnections:[],storefront:{},account:{}},reportsData:responses[2].ok?rp:{summary:{},byCategory:[],byGroup:[],byPlatform:[],byChannel:[],daily:[],topOffers:[],delivery:[]},aiStatus:b.aiStatus||{configured:false,model:'gemini-3.8-flash'}});updateAiBadge();render()}catch(e){document.getElementById('content').innerHTML='<div class="empty"><b>Não foi possível carregar</b><p>'+esc(e.message)+'</p><button class="btn" onclick="load()">Tentar novamente</button></div>'}}async function call(method,body,query){var r=await fetch('/api/data'+(query||''),{method:method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined}),b=await r.json();if(!r.ok)throw Error(b.error||'Não foi possível concluir');await load();return b}async function suiteCall(method,body){var r=await fetch('/api/suite',{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),b=await r.json();if(!r.ok)throw Error(b.error||'Não foi possível concluir');D.suite=b;render();return b}
function section(t,p,button,action){return '<div class="sectionhead"><div><h2>'+t+'</h2><p>'+p+'</p></div>'+(button?'<button class="btn" onclick="'+action+'">'+button+'</button>':'')+'</div>'}function empty(t){return '<div class="empty"><b>'+t+'</b><p>Use o botão acima para configurar.</p></div>'}function thumb(o){return o.imageUrl?'<img class="thumb" src="'+esc(o.imageUrl)+'" alt="Imagem do produto">':'<div class="thumb"></div>'}
function getStoreClass(source){var s=String(source||'').toLowerCase();if(s.includes('shopee'))return 'store-shopee';if(s.includes('mercado'))return 'store-ml';return 'store-amazon'}

async function copyText(text,msg){try{await navigator.clipboard.writeText(text);toast(msg||'✓ Texto copiado para a área de transferência!')}catch(e){toast('Não foi possível copiar automaticamente.')}}
function copyOfferText(id){var o=off(id);if(!o)return;copyText(o.message||o.title+'\n'+o.affiliateUrl,'✓ Mensagem da oferta copiada! Pronta para colar.')}
function sendToWhatsApp(id){var o=off(id);if(!o)return;var txt=encodeURIComponent(o.message||o.title+'\n'+o.affiliateUrl);window.open('https://api.whatsapp.com/send?text='+txt,'_blank','noopener')}
function copyPublicationText(id){var p=D.publications.find(function(x){return x.id===id});if(!p)return;var o=off(p.offerId);var txt=p.message||(o?o.message:'');copyText(txt,'✓ Mensagem do envio copiada!')}

function offerRow(o){var c=cat(o.categoryId),sClass=getStoreClass(o.source);return '<div class="row">'+thumb(o)+'<div class="grow"><b>'+esc(o.title)+'</b><div class="muted"><span class="store-tag '+sClass+'">'+esc(o.source)+'</span> · '+(c?c.icon+' '+esc(c.name):'Sem categoria')+' · <span class="pill '+(o.status==='APPROVED'?'live':'')+'">'+(LABEL[o.status]||o.status)+'</span></div><div class="price">'+brl(o.currentPrice)+(o.originalPrice?' <del class="muted">'+brl(o.originalPrice)+'</del>':'')+(o.discountPercent?' · <span class="pill live">'+o.discountPercent+'% OFF</span>':'')+'</div></div><div class="actions"><button class="btn secondary small" title="Copiar mensagem completa" onclick="copyOfferText(\''+o.id+'\')">📋 Copiar</button><button class="btn secondary small" title="Compartilhar no WhatsApp" onclick="sendToWhatsApp(\''+o.id+'\')">💬 WhatsApp</button>'+(o.status==='PENDING'?'<button class="btn green small" onclick="status(\'offer\',\''+o.id+'\',\'APPROVED\')">Aprovar</button>':'')+'<button class="btn dark small" onclick="prepare(\''+o.id+'\')">Preparar envio</button><button class="btn danger small" onclick="removeItem(\'offer\',\''+o.id+'\')">Excluir</button></div></div>'}
function dashboard(){var clicks=D.publications.reduce(function(s,p){return s+Number(p.clicks||0)},0),active=D.monitors.filter(function(x){return x.status==='ACTIVE'}).length,ready=D.publications.filter(function(x){return x.status==='READY'||x.status==='SCHEDULED'}).length;return '<section class="hero"><div><div class="eyebrow" style="color:#61e7ba">OPERAÇÃO INTELIGENTE</div><h2>Da oferta encontrada ao grupo certo, sem trabalho repetitivo.</h2><p>Monitore fontes, converta links, use IA Gemini 3.8 Flash para redigir textos persuasivos, organize filas e envie imagem com texto e link.</p><div class="actions"><button class="btn" onclick="openOffer()">+ Nova oferta</button><button class="btn secondary" onclick="show(\'quick\')">Criação rápida</button></div></div><div class="pulsebox"><div class="pulse"><span>Motor de automação</span><i class="dot"></i></div><strong>24/7</strong><small>'+active+' monitor(es) ativo(s) · '+ready+' item(ns) na fila</small></div></section><div class="metrics">'+metric('Ofertas capturadas',D.offers.length,'total no radar')+metric('Grupos ativos',D.groups.filter(function(g){return g.status==='ACTIVE'}).length,'por nicho')+metric('Envios na fila',ready,'prontos ou agendados')+metric('Cliques rastreados',clicks,'links publicados')+'</div>'+section('Quatro modos de operação','Escolha entre controle total e automação completa.')+'<div class="grid modes">'+mode('MODO 01','Monitoramento inteligente','Captura, valida, converte e distribui ofertas automaticamente.','monitoring')+mode('MODO 02','Clone fiel','Preserva texto e imagem; substitui somente links e cupons.','clone')+mode('MODO 03','Sob demanda','Cole um link e prepare a oferta em poucos segundos.','quick')+mode('MODO 04','Filas programadas','Horários, intervalos e recorrências por nicho.','queues')+'</div><div class="grid two">'+recent()+'<div>'+section('Atividade recente','O que o sistema executou.')+'<div class="card"><ul class="activity">'+(D.activity.length?D.activity.slice(0,7).map(functio function openOffer(){
  openModal(
    'Nova oferta com IA',
    'Preencha os dados e use a IA para redigir o texto persuasivo.',
    field('Imagem do produto','image','file','accept="image/jpeg,image/png,image/webp" required')+
    field('Nome do produto','title','text','required placeholder="Ex: Fone de Ouvido Bluetooth"')+

    '<div id="discountNotice" style="display:none;font-size:13px;font-weight:700;color:#0ca776;margin:-4px 0 6px"></div>'+
    field('Cupom de desconto (opcional)','coupon','text','placeholder="Ex: PROMO10"')+
    field('Link original do produto','productUrl','url','placeholder="https://..."')+
    field('Link oficial de afiliado','affiliateUrl','url','required placeholder="https://..."')+
    '<div class="field"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><label>Estilo da redação IA</label><select id="aiStyle" class="input" style="width:200px"><option value="urgency">🔥 Urgência Máxima</option><option value="discount">💥 Foco no Desconto</option><option value="clean">✨ Clean & Direto</option></select><button type="button" class="btn secondary" onclick="generateAI()">Gerar com IA</button></div></div>'+
    '<div class="field"><label>Mensagem da promoção (WhatsApp / Telegram)</label><textarea class="input" name="message" id="offerMessageText" rows="7" oninput="updateLivePreview()" placeholder="Clique em \'Gerar com IA\' para criar a mensagem automaticamente."></textarea></div>'+
    '<div class="preview-card"><label style="font-size:12px;font-weight:700;color:var(--muted)">Pré-visualização do card no WhatsApp:</label><div class="preview-bubble" id="liveMsgPreview">Sua mensagem formatada aparecerá aqui...</div></div>',
    async function(e){
      e.preventDefault();
      try{
        var fd=new FormData(e.target),up=new FormData();
        up.append('file',fd.get('image'));
        var ur=await fetch('/api/upload',{method:'POST',body:up}),ub=await ur.json();
        if(!ur.ok)throw Error(ub.error);

function calcDiscount(){
  var f=document.getElementById('form');if(!f)return;
  var cur=parseFloat(f.elements.currentPrice?.value||'0'),orig=parseFloat(f.elements.originalPrice?.value||'0');
  var box=document.getElementById('discountNotice');if(!box)return;
  if(cur>0&&orig>cur){
    var pct=Math.round(((orig-cur)/orig)*100);
    box.style.display='block';
